name: 価格取得（楽天API）

on:
  # 楽天ウェブサービスのIP許可リスト必須化に伴い、価格取得は固定IPのVPS cronへ移行。
  # GitHub Actionsは実行ごとにIPが変わり楽天APIに拒否される（＝null行を書き続ける）ため、自動実行を停止。
  # 手動実行(workflow_dispatch)は残すが、GitHub IPからは楽天APIが空を返す点に注意。
  # schedule:
  #   - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '取得対象（空欄で全製品）'
        required: false
        type: choice
        options:
          - ''
          - iphone
          - ipad
          - watch
          - airpods
          - macbook
          - pixel
          - galaxy

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run price fetch script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: npx tsx scripts/fetch-prices.ts ${{ github.event.inputs.target }}

      - name: Revalidate Next.js cache
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl --fail --silent --show-error \
            -X POST "https://used-lab.jp/api/revalidate-all" \
            -H "Authorization: Bearer ${REVALIDATE_SECRET}"
